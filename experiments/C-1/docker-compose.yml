services:
  router1:
    build: { context: ./router1 }
    container_name: h4-c1-router1
    environment: { NEXT_HOP: "http://sink:8080" }
    ports: [ "127.0.0.1:18140:8080" ]
    networks: [h4net]

  sink:
    build: { context: ./sink }
    container_name: h4-c1-sink
    ports: [ "127.0.0.1:18141:8080" ]
    networks: [h4net]

  client:
    build: { context: ./client }
    container_name: h4-c1-client
    depends_on: [router1, sink]
    networks: [h4net]

networks:
  h4net:
    driver: bridge
