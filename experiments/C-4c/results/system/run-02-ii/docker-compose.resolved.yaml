name: c-4c
services:
  client:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\C-4c\client
      dockerfile: Dockerfile
    container_name: h4-c4c-client
    depends_on:
      gateway-h:
        condition: service_started
      resolver-d1:
        condition: service_started
      resolver-d2:
        condition: service_started
      target:
        condition: service_started
    networks:
      h4net: null
  gateway-h:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\C-4c\gateway-h
      dockerfile: Dockerfile
    container_name: h4-c4c-gateway-h
    environment:
      TARGET_ADDRESS: http://target:8080
    networks:
      h4net: null
  resolver-d1:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\C-4c\resolver-d1
      dockerfile: Dockerfile
    container_name: h4-c4c-resolver-d1
    environment:
      UPSTREAM: http://gateway-h:8080
    networks:
      h4net: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 8080
      published: "18360"
      protocol: tcp
  resolver-d2:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\C-4c\resolver-d2
      dockerfile: Dockerfile
    container_name: h4-c4c-resolver-d2
    environment:
      UPSTREAM: http://gateway-h:8080
    networks:
      h4net: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 8080
      published: "18361"
      protocol: tcp
  target:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\C-4c\target
      dockerfile: Dockerfile
    container_name: h4-c4c-target
    networks:
      h4net: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 8080
      published: "18362"
      protocol: tcp
networks:
  h4net:
    name: c-4c_h4net
    driver: bridge
