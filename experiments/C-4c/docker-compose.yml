services:
  resolver-d1:
    build: { context: ./resolver-d1 }
    container_name: h4-c4c-resolver-d1
    environment: { UPSTREAM: "http://gateway-h:8080" }
    ports: [ "127.0.0.1:18360:8080" ]
    networks: [h4net]

  resolver-d2:
    build: { context: ./resolver-d2 }
    container_name: h4-c4c-resolver-d2
    environment: { UPSTREAM: "http://gateway-h:8080" }
    ports: [ "127.0.0.1:18361:8080" ]
    networks: [h4net]

  gateway-h:
    build: { context: ./gateway-h }
    container_name: h4-c4c-gateway-h
    environment: { TARGET_ADDRESS: "http://target:8080" }
    networks: [h4net]

  target:
    build: { context: ./target }
    container_name: h4-c4c-target
    ports: [ "127.0.0.1:18362:8080" ]
    networks: [h4net]

  client:
    build: { context: ./client }
    container_name: h4-c4c-client
    depends_on: [resolver-d1, resolver-d2, gateway-h, target]
    networks: [h4net]

networks:
  h4net:
    driver: bridge
