name: i-2
services:
  broker:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\I-2\broker
      dockerfile: Dockerfile
    container_name: h4-i2-broker
    networks:
      h4net: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 1883
      published: "18400"
      protocol: tcp
  receiver-1:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\I-2\receiver
      dockerfile: Dockerfile
    container_name: h4-i2-receiver-1
    depends_on:
      broker:
        condition: service_started
    environment:
      BROKER_HOST: broker
    networks:
      h4net: null
  receiver-2:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\I-2\receiver
      dockerfile: Dockerfile
    container_name: h4-i2-receiver-2
    depends_on:
      broker:
        condition: service_started
    environment:
      BROKER_HOST: broker
    networks:
      h4net: null
  receiver-3:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\I-2\receiver
      dockerfile: Dockerfile
    container_name: h4-i2-receiver-3
    depends_on:
      broker:
        condition: service_started
    environment:
      BROKER_HOST: broker
    networks:
      h4net: null
  source-t:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\I-2\source
      dockerfile: Dockerfile
    container_name: h4-i2-source-t
    depends_on:
      broker:
        condition: service_started
    environment:
      BROKER_HOST: broker
      MQTT_PASS: sourcet-pw
      MQTT_USER: source-t
    networks:
      h4net: null
networks:
  h4net:
    name: i-2_h4net
    driver: bridge
