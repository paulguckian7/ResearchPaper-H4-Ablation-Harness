name: c-4a
services:
  client:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\C-4a\client
      dockerfile: Dockerfile
    container_name: h4-c4a-client
    depends_on:
      resolver-d1:
        condition: service_started
      target:
        condition: service_started
    networks:
      h4net: null
  resolver-d1:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\C-4a\resolver-d1
      dockerfile: Dockerfile
    container_name: h4-c4a-resolver-d1
    environment:
      TARGET_ADDRESS: http://target:8080
    networks:
      h4net: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 8080
      published: "18340"
      protocol: tcp
  target:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\C-4a\target
      dockerfile: Dockerfile
    container_name: h4-c4a-target
    networks:
      h4net: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 8080
      published: "18341"
      protocol: tcp
networks:
  h4net:
    name: c-4a_h4net
    driver: bridge
