name: c-4b
services:
  client:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\C-4b\client
      dockerfile: Dockerfile
    container_name: h4-c4b-client
    depends_on:
      resolver-d1:
        condition: service_started
      resolver-d2:
        condition: service_started
      target:
        condition: service_started
    networks:
      h4net: null
  resolver-d1:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\C-4b\resolver-d1
      dockerfile: Dockerfile
    container_name: h4-c4b-resolver-d1
    environment:
      TARGET_ADDRESS: http://target:8080
    networks:
      h4net: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 8080
      published: "18350"
      protocol: tcp
  resolver-d2:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\C-4b\resolver-d2
      dockerfile: Dockerfile
    container_name: h4-c4b-resolver-d2
    environment:
      TARGET_ADDRESS: http://target:8080
    networks:
      h4net: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 8080
      published: "18351"
      protocol: tcp
  target:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\C-4b\target
      dockerfile: Dockerfile
    container_name: h4-c4b-target
    networks:
      h4net: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 8080
      published: "18352"
      protocol: tcp
networks:
  h4net:
    name: c-4b_h4net
    driver: bridge
