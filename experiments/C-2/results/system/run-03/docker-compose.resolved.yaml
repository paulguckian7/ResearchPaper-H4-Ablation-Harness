name: c-2
services:
  client:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\C-2\client
      dockerfile: Dockerfile
    container_name: h4-c2-client
    depends_on:
      router1:
        condition: service_started
      router2:
        condition: service_started
      sink:
        condition: service_started
    networks:
      h4net: null
  router1:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\C-2\router1
      dockerfile: Dockerfile
    container_name: h4-c2-router1
    environment:
      NEXT_HOP: http://sink:8080
    networks:
      h4net: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 8080
      published: "18150"
      protocol: tcp
  router2:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\C-2\router2
      dockerfile: Dockerfile
    container_name: h4-c2-router2
    environment:
      NEXT_HOP: http://sink:8080
    networks:
      h4net: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 8080
      published: "18151"
      protocol: tcp
  sink:
    build:
      context: C:\Research\H4_Ablation_Harness\experiments\C-2\sink
      dockerfile: Dockerfile
    container_name: h4-c2-sink
    networks:
      h4net: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 8080
      published: "18152"
      protocol: tcp
networks:
  h4net:
    name: c-2_h4net
    driver: bridge
