events {}
http {
    server {
        listen 8080;
        # /fwd location mapping removed. Requests to /fwd are still
        # admitted by nginx (it accepts the connection and parses the
        # request line -- admission is unaffected), but nginx itself has
        # nowhere configured to route them, so it returns 404 rather than
        # reaching the sink. This is a route-internal ablation (protocol
        # A7): no network reachability between proxy and sink is touched.
        location / {
            return 404;
        }
    }
}
